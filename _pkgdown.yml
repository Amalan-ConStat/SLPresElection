reference:
  - title: Election Data
    desc: >
      Sri Lankan presidential election results for eight elections
      from 1982 to 2019.
    contents:
      - Election1982
      - Election1988
      - Election1994
      - Election1999
      - Election2005
      - Election2010
      - Election2015
      - Election2019

articles:
  - title: Data Extraction and Preparation
    desc: >
      Year-specific documentation of data extraction, count corrections,
      percentage calculations, missing-value handling, and label
      harmonisation. The 2019 article also documents the OCR prompt,
      missing and misplaced result tables, and preserved
      registered-elector discrepancies.
    contents:
      - election-1982
      - election-1988
      - election-1994
      - election-1999
      - election-2005
      - election-2010
      - election-2015
      - election-2019

home:
  title: SLPresElection - Sri Lankan Presidential Election Data, 1982-2019
  description: >
    An R package containing Sri Lankan presidential election results
    for 1982, 1988, 1994, 1999, 2005, 2010, 2015, and 2019.
    Includes candidate vote counts, percentages, summary counts,
    and articles documenting data extraction and preparation.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

footer:
  structure:
    left: developed_by
    right: built_with
